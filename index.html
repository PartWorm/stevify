<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Skin Viewer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <canvas id="canvas"></canvas>

    <button id="select-skin" style="position: absolute; left: 0; top: 0;">Select skin</button>
    <button id="copy-screenshot" style="position: absolute; left: 100px; top: 0;">Copy scene</button>
    <button id="take-screenshot" style="position: absolute; left: 200px; top: 0;">Download scene</button>

    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js",
            "three/examples/jsm/": "./node_modules/three/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="renderer.js"></script>
</body>
</html>
